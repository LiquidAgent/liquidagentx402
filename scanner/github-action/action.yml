name: 'Liquid Agent Malware Scan'
description: 'Scan changed config files for PolinRider / Contagious Interview traits before install/build. Static only, never executes scanned files.'
author: 'Liquid Agent'
branding:
  icon: 'shield'
  color: 'red'
inputs:
  path:
    description: 'File or directory to scan'
    required: true
    default: '.'
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: node ${{ github.action_path }}/../scanner.js ${{ inputs.path }}
      shell: bash
